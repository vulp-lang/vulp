<svg xmlns='http://www.w3.org/2000/svg' width='760' height='396' viewBox='0 0 760 396' role='img' aria-labelledby='t d'><title id='t'>Runtime relative to C++</title><desc id='d'>Horizontal bars per problem for Vulp and Python, relative to C++ on a log scale.</desc><rect width='760' height='396' rx='8' fill='#fcfcfb'/><text x='20.0' y='28.0' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>Runtime relative to C++ (g++ -O2)</text><text x='20.0' y='48.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>Median of 7 runs, log scale. Bars grow from C++ = 1×: right = slower, left = faster.</text><rect x='560' y='19' width='10' height='10' rx='2' fill='#2a78d6'/><text x='575.0' y='28.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>Vulp</text><rect x='628' y='19' width='10' height='10' rx='2' fill='#1baf7a'/><text x='643.0' y='28.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>Python</text><line x1='190.0' y1='64' x2='190.0' y2='346' stroke='#e4e3df' stroke-width='1'/><text x='190.0' y='364.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>0.5×</text><line x1='278.3' y1='64' x2='278.3' y2='346' stroke='#52514e' stroke-width='1'/><text x='278.3' y='364.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>1×</text><line x1='366.7' y1='64' x2='366.7' y2='346' stroke='#e4e3df' stroke-width='1'/><text x='366.7' y='364.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Ar